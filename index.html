<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="theme-color" content="#060a13">
  <title>CyberShield – Web Security Awareness System</title>
  <style>
/* CyberShield – shared theme */
:root {
  --bg: #060a13; --bg2: #0a1120; --card: #0e1628; --card2: #121c33; --line: #1c2a47;
  --green: #00ff9c; --blue: #00b4ff; --red: #ff4d6d; --amber: #ffc857;
  --text: #e6f1ff; --muted: #8aa0c2; --radius: 14px;
  --glow-g: 0 0 18px rgba(91,224,164,.35); --glow-b: 0 0 18px rgba(106,174,255,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; color: var(--text); background: var(--bg);
  min-height: 100vh; line-height: 1.5; overflow-x: hidden;
  background-image:
    linear-gradient(rgba(91,224,164,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(106,174,255,.04) 1px, transparent 1px);
  background-size: 40px 40px; animation: gridMove 20s linear infinite;
}
@keyframes gridMove { to { background-position: 40px 40px, 40px 40px; } }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 20% 10%, rgba(106,174,255,.12), transparent 45%), radial-gradient(circle at 85% 90%, rgba(91,224,164,.10), transparent 45%); pointer-events: none; z-index: -1; }
a { color: var(--blue); text-decoration: none; }
h1, h2, h3 { line-height: 1.2; }
.mono { font-family: 'Consolas', 'Courier New', monospace; }
.grad { background: linear-gradient(90deg, var(--green), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* buttons & forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border: 0; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; color: #021018; background: linear-gradient(90deg, var(--green), var(--blue)); transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(-2px); box-shadow: var(--glow-g); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--green); border: 1px solid var(--green); }
.btn.sm { padding: 8px 14px; font-size: .9rem; }
label { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
input, select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font-size: 1rem; outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus { border-color: var(--green); box-shadow: var(--glow-g); }
.alert { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: .9rem; display: none; }
.alert.show { display: block; animation: pop .25s; }
.alert.err { background: rgba(255,133,149,.12); border: 1px solid var(--red); color: #ff9db0; }
.alert.ok { background: rgba(91,224,164,.1); border: 1px solid var(--green); color: var(--green); }
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } }

/* auth page */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.auth-card { width: 100%; max-width: 440px; background: rgba(14,22,40,.92); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: 0 10px 50px rgba(0,0,0,.5), var(--glow-b); animation: rise .6s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }
.brand { text-align: center; margin-bottom: 18px; }
.brand .shield { font-size: 3rem; animation: float 3s ease-in-out infinite; display: inline-block; filter: drop-shadow(0 0 12px var(--green)); }
@keyframes float { 50% { transform: translateY(-8px); } }
.brand h1 { font-size: 1.8rem; letter-spacing: 1px; }
.brand p { color: var(--muted); font-size: .9rem; }
.tabs { display: flex; background: var(--bg2); border-radius: 10px; padding: 4px; margin-bottom: 6px; }
.tabs button { flex: 1; padding: 10px; border: 0; background: none; color: var(--muted); font-weight: 600; border-radius: 8px; cursor: pointer; font-size: .95rem; }
.tabs button.active { background: var(--card2); color: var(--green); box-shadow: inset 0 0 0 1px var(--line); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meter { display: flex; gap: 4px; margin-top: 8px; }
.meter i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); transition: background .25s; }
.meter[data-s="1"] i:nth-child(-n+1) { background: var(--red); }
.meter[data-s="2"] i:nth-child(-n+2) { background: var(--amber); }
.meter[data-s="3"] i:nth-child(-n+3) { background: var(--blue); }
.meter[data-s="4"] i { background: var(--green); }
.hint { font-size: .78rem; color: var(--muted); margin-top: 6px; }
.demo-box { margin-top: 18px; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; font-size: .8rem; color: var(--muted); }
.demo-box b { color: var(--green); }
.linkbtn { background: none; border: 0; color: var(--blue); cursor: pointer; font-size: .8rem; text-decoration: underline; }
.hidden { display: none !important; }

/* app shell */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: rgba(6,10,19,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .logo { font-weight: 800; font-size: 1.15rem; letter-spacing: .5px; }
.topbar .spacer { flex: 1; }
.chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: .85rem; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #021018; background: linear-gradient(135deg, var(--green), var(--blue)); }
.menu-btn { display: none; background: none; border: 1px solid var(--line); color: var(--text); font-size: 1.3rem; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 58px); }
.sidebar { padding: 18px 12px; border-right: 1px solid var(--line); background: rgba(10,17,32,.7); }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--muted); font-size: .95rem; margin-bottom: 4px; transition: all .2s; }
.sidebar a:hover, .sidebar a.active { background: var(--card2); color: var(--green); }
.sidebar a.soon { opacity: .55; cursor: not-allowed; }
.sidebar small { margin-left: auto; font-size: .65rem; padding: 2px 6px; border-radius: 6px; background: var(--line); }
.sidebar hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
main { padding: 24px; max-width: 1150px; width: 100%; }
.hello h2 { font-size: 1.7rem; }
.hello p { color: var(--muted); margin-top: 4px; }

/* cards */
.grid { display: grid; gap: 16px; margin-top: 20px; }
.stats { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.cols { grid-template-columns: 1.3fr 1fr; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; transition: transform .2s, border-color .2s, box-shadow .2s; animation: rise .5s ease backwards; }
.card.hover:hover { transform: translateY(-4px); border-color: var(--green); box-shadow: var(--glow-g); }
.card h3 { font-size: 1.05rem; margin-bottom: 12px; }
.stat .num { font-size: 2rem; font-weight: 800; }
.stat .lbl { color: var(--muted); font-size: .85rem; }
.ring { --p: 0; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 8px; background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--line) 0); transition: background .6s; }
.ring span { width: 98px; height: 98px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 1.5rem; font-weight: 800; }
.bar { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--blue)); transition: width .8s ease; }
.mods { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.mod .ico { font-size: 2rem; }
.mod h4 { margin: 6px 0 4px; }
.mod p { color: var(--muted); font-size: .85rem; min-height: 40px; }
.tag { display: inline-block; font-size: .7rem; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-top: 10px; }
.tag.done { color: var(--green); border-color: var(--green); }
.tag.pts { color: var(--blue); border-color: var(--blue); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { text-align: center; padding: 10px 6px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); font-size: .72rem; }
.badge .b { font-size: 1.8rem; display: block; }
.badge.locked { filter: grayscale(1); opacity: .35; }
.badge.earned { border-color: var(--green); box-shadow: var(--glow-g); }
.list { list-style: none; }
.list li { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.list li:last-child { border: 0; }
.list .time { margin-left: auto; color: var(--muted); font-size: .75rem; white-space: nowrap; }
.rank { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 800; background: var(--line); }
.rank.r1 { background: var(--amber); color: #111; } .rank.r2 { background: #c0c8d6; color: #111; } .rank.r3 { background: #d08c5a; color: #111; }
.me { color: var(--green); font-weight: 700; }
.empty { color: var(--muted); font-size: .9rem; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--green); color: var(--green); padding: 10px 18px; border-radius: 10px; z-index: 99; box-shadow: var(--glow-g); animation: pop .3s; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; top: 58px; left: 0; bottom: 0; width: 240px; z-index: 25; transform: translateX(-100%); transition: transform .25s; background: var(--bg2); }
  .sidebar.open { transform: none; }
  .menu-btn { display: block; }
  .cols { grid-template-columns: 1fr; }
  main { padding: 16px; }
  .chip .nm { display: none; }
}
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } .auth-card { padding: 20px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.btn.full { width: 100%; margin-top: 18px; }


/* ================= additions for the full application ================= */
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--green); transform: scale(1.15); margin: 0; flex: none; }
input[type=number] { -moz-appearance: textfield; }
input[type=search] { -webkit-appearance: none; }
input[type=file] { padding: 9px; }
textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font-size: .95rem; outline: none; resize: vertical; font-family: inherit; }
textarea:focus { border-color: var(--green); box-shadow: var(--glow-g); }
textarea.mono { font-family: 'Consolas', 'Courier New', monospace; font-size: .85rem; }
label.chk, .chk { display: flex; align-items: center; gap: 10px; margin: 8px 0; color: var(--text); font-size: .92rem; cursor: pointer; }
.fld { margin: 0; }
.center { text-align: center; }
.muted { color: var(--muted); }
.btn.danger { background: linear-gradient(90deg, #ff4d6d, #ff8a5c); color: #1a0309; }
.btn.danger:hover { box-shadow: 0 0 18px rgba(255,133,149,.45); }
.btn.ghost.sm, .btn.sm { padding: 8px 14px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; justify-content: flex-end; }
.btn-row.left { justify-content: flex-start; margin: 10px 0; }
a.btn { text-decoration: none; }
h2 { font-size: 1.6rem; margin-bottom: 4px; }
h4 { margin: 14px 0 6px; }
main > div > h2 { margin-bottom: 6px; }
.stack { display: grid; gap: 16px; align-content: start; }
.grid.mods.flat { margin-top: 0; }
a.card.mod { color: var(--text); display: block; }
.mod .bar { margin: 10px 0 4px; }
.mod-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.ico.big { font-size: 2.6rem; filter: drop-shadow(0 0 10px rgba(91,224,164,.4)); }
.bar.thick { height: 10px; margin: 8px 0 2px; }
.banner { padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; border: 1px solid var(--blue); background: rgba(106,174,255,.08); font-size: .9rem; }
.banner.bad { border-color: var(--red); background: rgba(255,133,149,.1); color: #ffb3c0; }
.hint.center { margin-top: 14px; }
.auth-card form { margin-top: 4px; }
.auth-card .alert { margin-top: 12px; }

/* lessons + code */
.lesson-card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; list-style: none; }
.lesson-card summary::-webkit-details-marker { display: none; }
.lesson { margin-top: 10px; font-size: .95rem; }
.lesson h4 { color: var(--green); margin: 16px 0 6px; }
.lesson p { margin: 6px 0; color: #cfe0f5; }
.lesson ul { margin: 6px 0 6px 20px; color: #cfe0f5; }
.lesson li { margin: 3px 0; }
.codebox { background: #050810; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-family: 'Consolas', 'Courier New', monospace; font-size: .82rem; color: #b6ffe0; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 8px 0; }
.codebox .inj { background: rgba(243,203,122,.2); color: var(--amber); border-radius: 4px; padding: 0 2px; outline: 1px dashed var(--amber); }
.codebox .ph { background: rgba(106,174,255,.2); color: var(--blue); border-radius: 4px; padding: 0 3px; }
code { font-family: 'Consolas', 'Courier New', monospace; background: #050810; padding: 2px 6px; border-radius: 6px; color: var(--green); }

/* challenges */
.chal { margin-top: 16px; }
.chal-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.chal-head h3 { margin: 0; }
.prompt { color: #cfe0f5; margin-bottom: 10px; }
.pill { display: inline-block; font-size: .72rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--green); border-color: var(--green); background: rgba(91,224,164,.08); }
.pill.bad { color: var(--red); border-color: var(--red); background: rgba(255,133,149,.08); }
.pill.warn { color: var(--amber); border-color: var(--amber); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; margin: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); cursor: pointer; color: var(--text); font-size: .95rem; transition: border-color .2s, background .2s; }
.opt:hover { border-color: var(--blue); }
.opt input { margin-top: 3px; }
.opt.right { border-color: var(--green); background: rgba(91,224,164,.1); }
.opt.wrong { border-color: var(--red); background: rgba(255,133,149,.1); }
.out { margin-top: 12px; }
.feedback { padding: 10px 14px; border-radius: 10px; margin: 8px 0; font-size: .92rem; }
.feedback.good { border: 1px solid var(--green); background: rgba(91,224,164,.08); color: var(--green); }
.feedback.bad { border: 1px solid var(--red); background: rgba(255,133,149,.08); color: #ff9db0; }
.expl { color: #cfe0f5; font-size: .9rem; border-left: 3px solid var(--blue); padding-left: 10px; margin: 8px 0; }
.flagres { font-size: .88rem; display: grid; gap: 4px; margin: 6px 0; }

/* phishing mockups */
.email { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; color: #1b2433; margin: 8px 0; }
.email-head { background: #eef2f8; padding: 10px 14px; font-size: .85rem; border-bottom: 1px solid #d7deea; display: grid; gap: 2px; word-break: break-word; }
.email-body { padding: 14px; font-size: .92rem; }
.email-body p { margin: 8px 0; color: #1b2433; }
.attach { display: inline-block; padding: 6px 10px; border: 1px solid #c8d1e0; border-radius: 8px; background: #f6f8fb; font-size: .85rem; }
.fakelink { color: #1a5fd1 !important; text-decoration: underline; cursor: pointer; word-break: break-all; }
.sms { max-width: 420px; margin: 8px 0; }
.sms-from { font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
.bubble { background: #1d2a44; border-radius: 16px 16px 16px 4px; padding: 10px 14px; font-size: .92rem; }
.bubble p { margin: 4px 0; }
.bubble .fakelink { color: #6ab4ff !important; }
.addr { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: #050810; border: 1px solid var(--line); border-radius: 999px; font-family: 'Consolas', monospace; font-size: .9rem; word-break: break-all; margin: 8px 0; }
.addr .fakelink { color: var(--text) !important; text-decoration: none; }
.linkstatus { font-size: .82rem; color: var(--amber); margin: 8px 0; padding: 8px 12px; background: rgba(243,203,122,.07); border-radius: 8px; word-break: break-all; }
.flagbox { margin: 10px 0; }
.flagbox summary { cursor: pointer; color: var(--blue); font-size: .9rem; }
.chks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2px 14px; margin-top: 6px; }

/* sql + cookie forms */
.sqlform { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 14px; }
.qline { margin: 10px 0 4px; }
.cookie-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 4px 14px; align-items: end; margin: 8px 0; }
.scenario { padding: 10px 14px; border-radius: 10px; background: rgba(106,174,255,.07); border: 1px solid rgba(106,174,255,.3); font-size: .93rem; }
.fieldres { list-style: none; margin: 6px 0; display: grid; gap: 3px; font-size: .9rem; }
.fieldres .ok { color: var(--green); } .fieldres .bad { color: var(--red); }
.simrow { padding: 10px 14px; border-radius: 10px; margin: 8px 0; font-size: .9rem; }
.simrow.ok { border: 1px solid var(--green); background: rgba(91,224,164,.07); }
.simrow.bad { border: 1px solid var(--red); background: rgba(255,133,149,.07); }
.steps2 { margin: 8px 0 8px 20px; font-size: .9rem; color: #cfe0f5; display: grid; gap: 4px; }

/* csrf lab */
.seg { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.lab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.site { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg2); }
.site-bar { padding: 8px 12px; font-size: .8rem; font-family: 'Consolas', monospace; background: #050810; border-bottom: 1px solid var(--line); color: var(--muted); }
.site-body { padding: 14px; }
.site.evil { border-color: rgba(255,133,149,.5); }
.site.evil .site-bar { color: #ff9db0; }
.big-num { font-size: 2rem; font-weight: 800; }
.tokenbox { margin: 10px 0; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--green); font-size: .85rem; color: var(--green); }
.tokenbox.warn { border-color: var(--red); color: #ff9db0; }
.reqbox { margin-top: 12px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
.steps { list-style: none; display: grid; gap: 6px; margin-top: 6px; font-size: .9rem; }
.steps .ok { color: var(--green); }
.logl li { font-size: .82rem; gap: 8px; }
.logl li.bad { color: #ff9db0; }
.logl .who { font-family: 'Consolas', monospace; color: var(--blue); min-width: 84px; }

/* tables, toolbars, pagers, modals */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; word-break: break-word; }
.tbl tr:hover td { background: rgba(255,255,255,.02); }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pager { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 14px; font-size: .85rem; color: var(--muted); }
.toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 12px 0; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
.inline-form input, .inline-form select { width: auto; flex: 1 1 140px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.chip2 { border: 1px solid var(--green); color: var(--green); border-radius: 999px; padding: 3px 10px; font-size: .8rem; display: inline-flex; gap: 6px; align-items: center; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1rem; }
.x:hover { color: var(--red); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: .9rem; margin-bottom: 12px; }
.kv span { color: var(--muted); }
.kv b { word-break: break-word; }
.code-big { font-family: 'Consolas', monospace; font-size: 1.8rem; letter-spacing: 4px; text-align: center; padding: 14px; border: 1px dashed var(--green); border-radius: 12px; color: var(--green); margin: 12px 0; user-select: all; }

/* ================================================================
   CyberShield – core data layer (browser-only, plain JavaScript)
   Everything is stored in this browser's localStorage.
   ================================================================ */
'use strict';

const $ = (s, r = document) => r.querySelector(s);

/* Safe DOM builder: text is always inserted with textContent/TextNode, never innerHTML. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}

const COURSES = ['BS Information Technology', 'BS Computer Science', 'BS Information Systems', 'BS Computer Engineering', 'Other'];
const NAME_RE = /^[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ .'-]{1,59}$/;
const EMAIL_RE = /^[^\s@]{1,64}@[^\s@]{1,190}\.[^\s@]{2,}$/;
const SID_RE = /^[A-Za-z0-9-]{4,20}$/;
const SLUG_RE = /^[a-z0-9-]{2,60}$/;

const fmtDate = ts => (ts ? new Date(ts).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '—');
function ago(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const hr = Math.floor(m / 60);
  if (hr < 24) return hr + 'h ago';
  return Math.floor(hr / 24) + 'd ago';

const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const fromHex = hex => new Uint8Array((hex.match(/.{2}/g) || []).map(x => parseInt(x, 16)));
function rid(n = 8) {
  const a = new Uint8Array(n);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);

const pwProblem = p => {
  if (typeof p !== 'string' || p.length < 8 || p.length > 64) return 'Password must be 8–64 characters.';
  const miss = [];
  if (!/[a-z]/.test(p)) miss.push('a lowercase letter');
  if (!/[A-Z]/.test(p)) miss.push('an uppercase letter');
  if (!/\d/.test(p)) miss.push('a number');
  if (!/[^A-Za-z0-9]/.test(p)) miss.push('a symbol (for example ! @ # $ %)');

/* 4 bars: the last bar only fills when EVERY rule is met, so the meter never contradicts the rules */
const pwStrength = s => {
  const met = [s.length >= 8, /[a-z]/.test(s), /[A-Z]/.test(s), /\d/.test(s), /[^A-Za-z0-9]/.test(s)].filter(Boolean).length;
  return met === 5 ? 4 : Math.min(met, 3);

/* ---------------- password hashing ---------------- */
function cyrb53(str, seed = 0) { // fallback only (when Web Crypto is unavailable)
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;

/* ---------------- storage ---------------- */
const DB_KEY = 'cybershield_db_v2';
const SES_KEY = 'cybershield_session_v2';
const SESSION_MS = 2 * 60 * 60 * 1000;
let db;
let persistent = true;

function freshDb() {
  const d = { v: 2, seq: 100, users: [], modules: [], challenges: [], results: {}, quizAttempts: [], achievements: [], userAch: [], adjustments: [], notifs: [], logs: [], labs: {}, resets: {}, locks: {}, created: Date.now() };

function loadDb() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.v === 2 && Array.isArray(d.users)) return d; }
  } catch (e) { persistent = false; }
  return freshDb();

function saveDb() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) { persistent = false; }
}
const nid = () => db.seq++;

/* ---------------- session ---------------- */
function readSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SES_KEY));
    if (s && s.uid && Date.now() < s.exp) return s;
  } catch (e) { /* ignore */ }
  return null;
}
function currentUser() {
  const s = readSession();
  if (!s) return null;
  const u = db.users.find(x => x.id === s.uid);
  if (!u || !u.active) { endSession(); return null; }
  try { localStorage.setItem(SES_KEY, JSON.stringify({ uid: s.uid, sid: s.sid, exp: Date.now() + SESSION_MS })); } catch (e) { /* ignore */ }

function evaluateAch(uid) {
  const u = db.users.find(x => x.id === uid);
  if (!u || u.role !== 'student') return [];
  const have = new Set(db.userAch.filter(x => x.uid === uid).map(x => x.aid));
  const cands = db.achievements.filter(a => a.active && !have.has(a.id));
  if (!cands.length) return [];
  const pts = total(uid), prog = progress(uid), done = completedCount(uid);
  const mods = Object.values(prog);
  const fresh = [];
  for (const a of cands) {
    let ok = false;
    switch (a.criteria) {
      case 'first_login': ok = true; break;
      case 'module_complete': ok = !!(a.moduleId && prog[a.moduleId] && prog[a.moduleId].done >= prog[a.moduleId].total); break;
      case 'points_at_least': ok = pts >= (a.value || 0); break;
      case 'challenges_at_least': ok = done >= (a.value || 0); break;
      case 'perfect_quiz': ok = db.quizAttempts.some(q => q.uid === uid && q.total > 0 && q.score === q.total && (!a.moduleId || q.moduleId === a.moduleId)); break;
      case 'all_modules': ok = mods.length > 0 && mods.every(p => p.done >= p.total); break;
      default: ok = false;
    }
    if (ok && awardAch(uid, a)) fresh.push({ name: a.name, icon: a.icon });
  }
  return fresh;
}

/* ---------------- grading: the ONLY place answers are judged and points are created ---------------- */
const FACTORS = [1, 0.5, 0.25];
const PENALISED = ['mcq', 'phish', 'cookie'];

function checkAnswer(uid, c, a) {
  const ans = c.answer || {};
  switch (c.type) {
    case 'mcq': {
      const idx = Number.isInteger(a.index) ? a.index : -1;
      return { correct: idx === ans.correct, detail: { correctIndex: ans.correct } };
    }
    case 'phish': {
      const given = [...new Set((Array.isArray(a.flags) ? a.flags : []).map(String))];
      const want = (ans.flags || []).map(String);
      return {
        correct: a.verdict === ans.verdict,
        detail: { verdict: ans.verdict, found: want.filter(x => given.includes(x)), missed: want.filter(x => !given.includes(x)), wrong: given.filter(x => !want.includes(x)) }
      };
    }
    case 'sqli': {
      const inputs = cleanInputs(c, a.inputs || {});
      const res = SqlLab.run(c.payload.template, inputs, false);
      return { correct: SqlLab.goalReached(ans.goal, res, inputs), detail: res };
    }
    case 'cookie': {
      const r = CookieGrader.check(ans, a);
      return { correct: r.correct, detail: { fields: r.fields } };
    }
    case 'csrf_lab': {
      const st = (db.labs[uid] && db.labs[uid].csrf) || CsrfLab.fresh();
      return { correct: CsrfLab.complete(st), detail: { flags: st.flags } };
    }
  }
  return { correct: false, detail: {} };
}
function cleanInputs(c, raw) {
  const out = {};
  for (const f of (c.payload && c.payload.fields) || []) out[f.name] = String((raw && raw[f.name]) ?? '').slice(0, 300);
  return out;
}
function grade(uid, c, answer) {
  db.results[uid] = db.results[uid] || {};
  const r = db.results[uid][c.id] = db.results[uid][c.id] || { attempts: 0, wrong: 0, points: 0, done: null };
  const chk = checkAnswer(uid, c, answer || {});
  const already = !!r.done;
  let earned = 0;
  r.attempts++;
  if (chk.correct) {
    if (!already) {
      const f = FACTORS[Math.min(r.wrong, FACTORS.length - 1)];
      earned = c.points > 0 ? Math.max(1, Math.floor(c.points * f)) : 0;
      r.points = earned;
      r.done = Date.now();
      logAct('challenge.completed', { challenge: c.id, points: earned }, uid);
    }
  } else if (!already && PENALISED.includes(c.type)) r.wrong++;
  const fresh = evaluateAch(uid);
  saveDb();
  return { correct: chk.correct, earned, already, explanation: c.explanation || '', detail: chk.detail, newAch: fresh, total: total(uid) };
}

/* ---------------- authentication ---------------- */
function pubUser(u) { return { id: u.id, name: u.name, email: u.email, sid: u.sid, course: u.course, role: u.role }; }

async function createUser({ name, email, sid, course, role = 'student', password, sample = false }) {
  const salt = rid(16);
  const u = {
    id: nid(), name, email, sid: sid || '', course: course || '', role, active: true, salt,
    hash: sample ? 'x' : await hashSecret(password, salt), created: Date.now(), lastLogin: null, sample: !!sample
  };
  db.users.push(u);
  return u;
}
function validateProfile(d, { needSid = true, ignoreId = null } = {}) {
  const name = String(d.name || '').trim().replace(/\s+/g, ' ');
  const email = String(d.email || '').trim().toLowerCase();
  const sid = String(d.sid || '').trim();
  if (!NAME_RE.test(name)) return { error: "Enter a valid name (letters, spaces, . ' - only)." };
  if (!EMAIL_RE.test(email) || email.length > 254) return { error: 'Enter a valid email address.' };
  if (needSid && !SID_RE.test(sid)) return { error: 'Student ID must be 4–20 letters, numbers or dashes.' };
  if (!needSid && sid && !SID_RE.test(sid)) return { error: 'Student ID must be 4–20 letters, numbers or dashes.' };
  if (d.course && !COURSES.includes(d.course)) return { error: 'Choose a course from the list.' };
  if (db.users.some(u => u.id !== ignoreId && u.email === email)) return { error: 'That email is already registered.' };
  if (sid && db.users.some(u => u.id !== ignoreId && u.sid.toLowerCase() === sid.toLowerCase())) return { error: 'That student ID is already registered.' };
  return { name, email, sid, course: d.course || '' };
}
const hasAdmin = () => db.users.some(u => u.role === 'admin' && u.active);

const Auth = {
  async setupAdmin(f) {
    if (hasAdmin()) return { ok: false, error: 'An administrator already exists.' };
    const v = validateProfile({ ...f, course: 'Other' }, { needSid: false });
    if (v.error) return { ok: false, error: v.error };
    const pe = pwProblem(f.password);
    if (pe) return { ok: false, error: pe };
    if (f.password !== f.confirm) return { ok: false, error: 'Passwords do not match.' };
    const u = await createUser({ ...v, sid: v.sid || 'ADMIN-001', role: 'admin', password: f.password });
    u.lastLogin = Date.now();
    logAct('admin.first_admin_created', {}, u.id);
    startSession(u.id);
    saveDb();
    return { ok: true };
  },
  async register(f) {
    const v = validateProfile(f);
    if (v.error) return { ok: false, error: v.error };
    if (!v.course) return { ok: false, error: 'Choose a course from the list.' };
    const pe = pwProblem(f.password);
    if (pe) return { ok: false, error: pe };
    if (f.password !== f.confirm) return { ok: false, error: 'Passwords do not match.' };
    const u = await createUser({ ...v, role: 'student', password: f.password }); // role is always 'student' here
    u.lastLogin = Date.now();
    logAct('auth.register', {}, u.id);
    startSession(u.id);
    evaluateAch(u.id);
    saveDb();
    return { ok: true };
  },
  async login(email, password) {
    email = String(email || '').trim().toLowerCase();
    password = String(password || '');
    const L = db.locks[email];
    if (L && L.until > Date.now()) return { ok: false, error: `Too many attempts. Try again in ${Math.ceil((L.until - Date.now()) / 1000)}s.` };
    const u = db.users.find(x => x.email === email);
    let good = false;
    if (u) good = safeEqual(await hashSecret(password, u.salt), u.hash);
    else await hashSecret(password, rid(16)); // similar timing for unknown emails
    if (!good) {
      const expired = L && L.until > 0 && L.until <= Date.now();
      const n = ((L && !expired ? L.n : 0) || 0) + 1;
      db.locks[email] = n >= 5 ? { n: 0, until: Date.now() + 60000 } : { n, until: 0 };
      logAct('auth.login_failed', { email }, u ? u.id : null);
      saveDb();
      return { ok: false, error: 'Invalid email or password.' };
    }
    if (!u.active) { logAct('auth.login_blocked', { email }, u.id); saveDb(); return { ok: false, error: 'Your account has been disabled. Please contact your instructor.' }; }
    delete db.locks[email];
    u.lastLogin = Date.now();
    logAct('auth.login', {}, u.id);
    startSession(u.id);
    evaluateAch(u.id);
    saveDb();
    return { ok: true };
  },
  logout() { const s = readSession(); if (s) { logAct('auth.logout', {}, s.uid); saveDb(); } endSession(); },
  async resetWithCode(email, code, newPw, confirm) {
    email = String(email || '').trim().toLowerCase();
    const generic = { ok: false, error: 'Invalid email or reset code (codes expire after 30 minutes).' };
    const r = db.resets[email];
    const pe = pwProblem(newPw);
    if (pe) return { ok: false, error: pe };
    if (newPw !== confirm) return { ok: false, error: 'Passwords do not match.' };
    if (!r || r.exp < Date.now() || r.tries >= 5) { delete db.resets[email]; saveDb(); return generic; }
    const u = db.users.find(x => x.email === email);
    if (!u) return generic;
    const ok = safeEqual(await hashSecret(String(code || '').trim().toUpperCase(), r.salt), r.hash);
    if (!ok) { r.tries++; saveDb(); return generic; }
    u.salt = rid(16);
    u.hash = await hashSecret(newPw, u.salt);
    delete db.resets[email];
    delete db.locks[email];
    logAct('auth.password_reset_done', {}, u.id);
    notify(u.id, 'Password changed', 'Your password was reset with an instructor-issued code.');
    saveDb();
    return { ok: true };
  }
};

    u.name = name;
    if (u.role === 'student') u.course = course;
    logAct('profile.updated', {}, u.id);
    saveDb();
    return { ok: true };
  },
  async changePassword(u, current, next, confirm) {
    if (!safeEqual(await hashSecret(String(current || ''), u.salt), u.hash)) return { ok: false, error: 'Current password is incorrect.' };
    const pe = pwProblem(next);
    if (pe) return { ok: false, error: pe };
    if (next !== confirm) return { ok: false, error: 'Passwords do not match.' };
    if (next === current) return { ok: false, error: 'New password must be different.' };
    u.salt = rid(16);
    u.hash = await hashSecret(next, u.salt);
    logAct('auth.password_changed', {}, u.id);
    saveDb();
    return { ok: true };
  }
};

/* ---------- CSRF lab: fake bank, fake money, state stored per student ---------- */
const CsrfLab = {
  fresh() { return { balance: 1000, attacker: 0, mode: 'vulnerable', token: null, flags: { attack: false, defense: false, legit: false }, log: [] }; },
  _log(s, who, text, ok) { s.log.unshift({ who, text, ok }); s.log = s.log.slice(0, 12); },
  setMode(s, mode) {
    s.mode = mode === 'secure' ? 'secure' : 'vulnerable';
    s.token = s.mode === 'secure' ? rid(16) : null;
    this._log(s, 'system', 'Bank switched to ' + s.mode.toUpperCase() + ' mode.', true);
    return s;
  },
  transfer(s, amount, token) {
    if (!Number.isInteger(amount) || amount < 1 || amount > s.balance) {
      this._log(s, 'you', `Transfer of ${amount} refused: invalid amount or insufficient funds.`, false);
      return { ok: false, status: 422, message: 'Invalid amount or insufficient funds.' };
    }
    if (s.mode === 'secure' && !(typeof s.token === 'string' && typeof token === 'string' && token !== '' && safeEqual(s.token, token))) {
      this._log(s, 'you', 'Transfer rejected: missing or invalid CSRF token.', false);
      return { ok: false, status: 403, message: 'Rejected (403): missing or invalid CSRF token.' };
    }
    s.balance -= amount;
    if (s.mode === 'secure') s.flags.legit = true;
    this._log(s, 'you', `Transfer of ${amount} to Campus Bookstore accepted.`, true);
    return { ok: true, status: 200, message: `Accepted (200): ${amount} sent to Campus Bookstore.` };
  },
  forge(s, amount) {
    amount = Math.max(1, Math.min(Number(amount) || 1, 500));
    if (s.mode === 'secure') {
      s.flags.defense = true;
      this._log(s, 'evil.example', `Forged transfer of ${amount} BLOCKED: no valid CSRF token.`, false);
      return { ok: false, status: 403, message: 'Blocked (403): the forged request carried the session cookie but no valid CSRF token.' };
    }
    const moved = Math.min(amount, s.balance);
    if (moved < 1) return { ok: false, status: 422, message: 'Nothing left to steal. Press "Reset balances".' };
    s.balance -= moved;
    s.attacker += moved;
    s.flags.attack = true;
    this._log(s, 'evil.example', `Forged transfer of ${moved} to attacker ACCEPTED (no token was checked).`, true);
    return { ok: true, status: 200, message: `Accepted (200): the bank trusted the cookie and moved ${moved} to the attacker.` };
  },
  complete: s => !!(s.flags.attack && s.flags.defense && s.flags.legit)
};

/* ---------- Cookie scenario grader ---------- */
const CookieGrader = {
  SAMESITE: ['Strict', 'Lax', 'None', ''],
  LIFETIME: ['session', 'short', 'long'],
  normalize(a) {
    const ss = String(a.samesite ?? ''), lt = String(a.lifetime ?? 'session');
    return { httponly: a.httponly === true || a.httponly === 'true', secure: a.secure === true || a.secure === 'true', samesite: this.SAMESITE.includes(ss) ? ss : '', lifetime: this.LIFETIME.includes(lt) ? lt : 'session' };
  },
  check(rules, answer) {
    const a = this.normalize(answer);
    const fields = {};
    let ok = true;
    for (const k of Object.keys(rules)) {
      const allowed = rules[k];
      const good = Array.isArray(allowed) ? allowed.includes(a[k]) : a[k] === allowed;
      fields[k] = good;
      ok = ok && good;
    }
    return { correct: ok, fields };
  }
};

/* ---------- validation of admin-authored challenges ---------- */
const ChallengeSchema = {
  TYPES: ['mcq', 'phish', 'sqli', 'cookie', 'csrf_lab'],
  GOALS: ['login_admin', 'login_admin_blank_password', 'reveal_hidden'],
  validate(type, payload, answer) {
    const e = [];
    payload = payload && typeof payload === 'object' ? payload : {};
    answer = answer && typeof answer === 'object' ? answer : {};
    switch (type) {
      case 'mcq': {
        const o = payload.options;
        if (!Array.isArray(o) || o.length < 2 || o.length > 6) { e.push('Provide 2 to 6 answer options.'); break; }
        if (o.some(x => typeof x !== 'string' || !x.trim() || x.length > 200)) e.push('Each option must be 1–200 characters.');
        if (!Number.isInteger(answer.correct) || answer.correct < 0 || answer.correct >= o.length) e.push('The correct option number is out of range.');
        break;
      }
      case 'phish':
        if (!['email', 'sms', 'link'].includes(payload.kind)) e.push('payload.kind must be "email", "sms" or "link".');
        if (payload.kind === 'link' ? typeof payload.url !== 'string' : !(Array.isArray(payload.body) || typeof payload.body === 'string')) e.push('payload needs "url" (link) or "body" (email/sms).');
        if (!['phishing', 'legit'].includes(answer.verdict)) e.push('answer.verdict must be "phishing" or "legit".');
        if (answer.flags !== undefined && !Array.isArray(answer.flags)) e.push('answer.flags must be a list.');
        break;
      case 'sqli': {
        const t = payload.template, f = payload.fields;
        if (typeof t !== 'string' || !Array.isArray(f) || f.length < 1 || f.length > 4) { e.push('payload needs "template" and 1–4 "fields".'); break; }
        if (f.some(x => !x || !/^\w{1,30}$/.test(x.name || '') || !t.includes('{' + x.name + '}'))) e.push('Every field name must appear in the template as {name}.');
        if (!this.GOALS.includes(answer.goal)) e.push('answer.goal must be one of: ' + this.GOALS.join(', ') + '.');
        break;
      }
      case 'cookie':
        if (typeof payload.scenario !== 'string' || !payload.scenario.trim()) e.push('payload.scenario text is required.');
        for (const k of ['httponly', 'secure']) if (typeof answer[k] !== 'boolean') e.push('answer.' + k + ' must be true or false.');
        for (const [k, allowed] of [['samesite', CookieGrader.SAMESITE], ['lifetime', CookieGrader.LIFETIME]]) {
          const v = answer[k];
          if (!Array.isArray(v) || !v.length || v.some(x => !allowed.includes(x))) e.push('answer.' + k + ' must be a non-empty list of: ' + allowed.map(x => x === '' ? '""' : x).join(', ') + '.');
        }
        break;
      case 'csrf_lab': break;
      default: e.push('Unknown challenge type.');
    }
    return e;
  }
};

function toast(msg, bad) {
  const t = h('div', { class: 'toast' + (bad ? ' bad' : ''), role: 'status' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}
function notifyAch(list) { (list || []).forEach((a, i) => setTimeout(() => toast(`${a.icon} Achievement unlocked: ${a.name}`), i * 900)); }
function card(title, ...kids) { return h('div', { class: 'card' }, title ? h('h3', null, title) : null, ...kids); }
function pill(text, cls = '') { return h('span', { class: 'pill ' + cls }, text); }
function statCard(icon, num, label) { return h('div', { class: 'card stat hover' }, h('div', null, icon), h('div', { class: 'num grad' }, String(num)), h('div', { class: 'lbl' }, label)); }

  document.body.append(back);

}

/* ---------- lesson renderer (plain-text markup -> safe DOM) ---------- */
function renderLesson(text) {
  const box = h('div', { class: 'lesson' });
  const lines = String(text || '').split('\n');
  let para = [], list = null, code = null;
  const flushPara = () => { if (para.length) { box.append(h('p', null, para.join(' '))); para = []; } };
  const flushList = () => { if (list) { box.append(h('ul', null, list.map(x => h('li', null, x)))); list = null; } };
  for (const raw of lines) {
    if (raw.trim().startsWith('```')) {
      if (code) { box.append(h('pre', { class: 'codebox' }, code.join('\n'))); code = null; } else { flushPara(); flushList(); code = []; }
      continue;
    }
    if (code) { code.push(raw); continue; }
    const line = raw.trimEnd();
    if (!line.trim()) { flushPara(); flushList(); continue; }
    if (line.startsWith('# ')) { flushPara(); flushList(); box.append(h('h4', null, line.slice(2))); continue; }
    if (line.startsWith('- ')) { flushPara(); (list = list || []).push(line.slice(2)); continue; }
    flushList();
    para.push(line.trim());
  }
  flushPara(); flushList();
  if (code) box.append(h('pre', { class: 'codebox' }, code.join('\n')));
  return box;
}

function render() {
  closeModals();
  user = currentUser();
  const root = $('#app');
  root.replaceChildren();
  const r = route();
  if (!user) {
    root.append(authView());
    return;
  }
  if (user.role === 'admin') {
    if (r[0] !== 'admin' && r[0] !== 'profile') { go('/admin'); return; }
  } else if (r[0] === 'admin') {
    logAct('security.admin_denied', { path: r.join('/') });
    saveDb();
    toast('Administrator access required.', true);
    go('/dashboard');
    return;
  }
  let page;
  let key = r[0] || 'dashboard';
  try {
    if (r[0] === 'admin') page = adminPage(r);
    else if (r[0] === 'm' && r[1]) { page = moduleView(r[1]); key = 'm/' + r[1]; }
    else if (r[0] === 'leaderboard') page = leaderboardView();
    else if (r[0] === 'achievements') page = achievementsView();
    else if (r[0] === 'notifications') page = notificationsView();
    else if (r[0] === 'profile') page = profileView();
    else { page = dashboardView(); key = 'dashboard'; }
  } catch (e) {
    page = card('Something went wrong', note(e && e.message ? e.message : 'Unexpected error.'));
  }
  root.append(shell(page, r[0] === 'admin' ? 'admin/' + (r[1] || '') : key));
  window.scrollTo(0, 0);
}

/* ---------------- quizzes ---------------- */
const Quiz = {
  submit(uid, m, answers) {
    const qs = publishedChallenges(m);
    let score = 0, earned = 0;
    const per = [], saved = {};
    const fresh = [];
    for (const q of qs) {
      const idx = Number.isInteger(answers[q.id]) ? answers[q.id] : -1;
      const g = grade(uid, q, { index: idx });
      score += g.correct ? 1 : 0;
      earned += g.earned;
      fresh.push(...g.newAch);
      saved[q.id] = idx;
      per.push({ id: q.id, correct: g.correct, correctIndex: g.detail.correctIndex, explanation: g.explanation });
    }
    db.quizAttempts.push({ id: nid(), uid, moduleId: m.id, score, total: qs.length, answers: saved, at: Date.now() });
    logAct('quiz.submitted', { module: m.slug, score, total: qs.length }, uid);
    fresh.push(...evaluateAch(uid));
    saveDb();
    return { score, total: qs.length, earned, per, newAch: fresh };
  }
};

/* ================================================================

function guard() {

    for (const uid in db.results) for (const cid in db.results[uid]) if (db.results[uid][cid].done) completions++;
    return {
      students: students.length, activeStudents: students.filter(u => u.active).length,
      active7d: students.filter(u => u.lastLogin && u.lastLogin >= week).length, new7d: students.filter(u => u.created >= week).length,

      completions, quizAttempts: db.quizAttempts.length, avgQuiz: q.length ? Math.round(q.reduce((s, a) => s + a.score * 100 / a.total, 0) / q.length) : null,
      registrations: Array.from({ length: 14 }, (_, i) => {
        const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (13 - i));
        const from = d.getTime(), to = from + 864e5;
        return { label: d.toLocaleDateString([], { month: 'short', day: 'numeric' }), count: students.filter(u => u.created >= from && u.created < to).length };
      }),
      recent: db.logs.slice(0, 10)
    };
  },
  reports() {
    guard();
    const students = db.users.filter(u => u.role === 'student');
    const modules = db.modules.slice().sort((a, b) => a.position - b.position).map(m => {
      const cs = publishedChallenges(m);
      let started = 0, completed = 0;
      for (const s of students) {
        const res = db.results[s.id] || {};
        const touched = cs.filter(c => res[c.id]).length, done = cs.filter(c => res[c.id] && res[c.id].done).length;
        if (touched) started++;
        if (cs.length && done >= cs.length) completed++;
      }
      return { title: m.title, icon: m.icon, published: m.published, challenges: cs.length, started, completed };
    });
    const challenges = db.challenges.map(c => {
      let attempted = 0, solved = 0, att = 0;
      for (const s of students) { const r = (db.results[s.id] || {})[c.id]; if (r) { attempted++; att += r.attempts; if (r.done) solved++; } }
      const m = db.modules.find(x => x.id === c.moduleId);
      return { title: c.title, module: m ? m.title : '?', attempted, solved, rate: attempted ? Math.round(solved * 100 / attempted) : null, avg: attempted ? Math.round(att * 10 / attempted) / 10 : 0 };
    });
    const quizzes = db.modules.filter(m => m.type === 'quiz').map(m => {

    rows.sort(sorters[f.sort] || sorters.name);

/* ---------------- backup & data ---------------- */
function adminData() {
  const size = (() => { try { return Math.round(JSON.stringify(db).length / 1024); } catch (e) { return 0; } })();
  const file = h('input', { type: 'file', accept: 'application/json,.json' });
  return h('div', null, h('h2', null, '💾 Backup & data'),
    card('Where is my data?', h('p', null, `All accounts, scores and settings live in THIS browser's storage (about ${size} KB now). It survives closing the browser, but it is lost if you clear site data or switch browser/device. Download a backup regularly.`),
      h('p', { class: 'hint' }, `Records: ${db.users.length} accounts · ${db.modules.length} modules · ${db.challenges.length} challenges · ${db.quizAttempts.length} quiz attempts · ${db.logs.length} log entries.`)),
    card('Download a backup', h('p', null, 'Saves everything (including password hashes) to a JSON file. Keep it private.'), h('button', { class: 'btn sm', onclick: () => download(`cybershield-backup-${new Date().toISOString().slice(0, 10)}.json`, Admin.exportDb(), 'application/json') }, '⬇ Download backup')),
    card('Restore from a backup', h('p', null, 'Replaces ALL current data with the file you choose.'), file, h('div', { class: 'btn-row left' }, h('button', { class: 'btn ghost sm', onclick: async () => {
      const f = file.files[0];
      if (!f) return toast('Choose a backup file first.', true);
      if (f.size > 8 * 1024 * 1024) return toast('That file is too large.', true);
      if (!(await confirmBox('Replace all current data with this backup?', 'Restore'))) return;
      const text = await f.text();
      const r = Admin.importDb(text);
      if (!r.ok) return toast(r.error, true);
      endSession(); toast('Backup restored. Please log in again.'); go('/'); render();
    } }, 'Restore'))),
    card('⚠️ Reset everything', h('p', null, 'Deletes every account, score and custom content in this browser and returns to first-time setup.'), h('button', { class: 'btn danger sm', onclick: () => {
      const input = h('input', { type: 'text', placeholder: 'Type DELETE', autocomplete: 'off' });
      const mm = modal('Reset all data', h('div', null, h('p', null, 'This cannot be undone. Type DELETE to confirm.'), input, h('div', { class: 'btn-row' }, h('button', { class: 'btn ghost', onclick: () => mm.close() }, 'Cancel'), h('button', { class: 'btn danger', onclick: () => { if (input.value !== 'DELETE') return toast('Type DELETE exactly.', true); Admin.resetAll(); db = freshDb(); mm.close(); go('/'); render(); } }, 'Erase everything'))));
    } }, 'Erase all data')),

      h('li', null, 'Leaderboards only include accounts stored in this same browser.'))));

(function boot() {
  db = loadDb();
  saveDb();
  window.addEventListener('hashchange', render);

  render();
})();
